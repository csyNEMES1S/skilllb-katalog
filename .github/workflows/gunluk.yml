name: Günlük derleme

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kayitlar/**"
      - "gorseller/**"
      - "site/**"
      - "scripts/**"
      - "package-lock.json"

# Varsayılan izin yok; her iş yalnız gerekeni ister.
permissions: {}

# Aynı anda iki çalışma olmasın (ikisi de Pages'e yazar ve aynı dalları açabilir). Yarıdaki iş kesilmez.
concurrency:
  group: gunluk
  cancel-in-progress: false

# Üçüncü taraf action'lar commit sha'sına sabitlidir (etiket taşınabilir); yorum o sha'nın sürümüdür.
# Üçüncü taraf repo verisini işleyen adımlar "::stop-commands::" ile sarılır: çıktıdaki hiçbir satır
# iş akışı komutu olarak işlenmez (rastgele belirteç tahmin edilemez, yalnız adımın kendisi geri açar).

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Kataloğu derle
        shell: bash
        run: |
          DUR="$(openssl rand -hex 16)"
          echo "::stop-commands::$DUR"
          npm run derle -- --cikti dist/catalog.json
          echo "::$DUR::"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      - id: dagit
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  guncellemeler:
    # Yalnız zamanlanmış ve elle başlatılan çalışmalarda; kayıt push'u yalnız yayınlar.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Güncellemeleri bul
        shell: bash
        run: |
          DUR="$(openssl rand -hex 16)"
          echo "::stop-commands::$DUR"
          npm run guncelle -- --cikti dist/guncellemeler.json
          echo "::$DUR::"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Git kimliği
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Güncelleme PR'larını aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Güvenilmez metnin nasıl ele alındığı ve hata yolları betiğin başında anlatılır.
        shell: bash
        run: bash .github/scripts/guncelleme-pr.sh dist/guncellemeler.json
