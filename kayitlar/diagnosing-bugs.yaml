en:
  ad: "Bug Hunter"
  kisaAciklama: "Diagnoses hard bugs and slowdowns step by step."
  neIseYarar:
    - "For anything broken, failing or slow, first builds a fast check that reproduces the problem every time."
    - "Shrinks the bug to its smallest form, ranks a few likely causes and tests them one by one to find the real one."
    - "Writes a test that catches the bug before fixing it, then cleans up temporary experiments and debug logging."
  ornekCumleler:
    - "The app crashes when I press Save, find out why."
    - "This page has been very slow since the last release, investigate."
    - "This bug only happens sometimes; help me reproduce it reliably."
