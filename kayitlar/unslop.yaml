id: unslop
ad: "Yapay Görünümlü Arayüz Düzeltici"
kisaAciklama: "Yapay zekâ kokan arayüzleri özenli bir tasarıma çevirir."
neIseYarar:
  - "Yapay zekâyla üretilmiş gibi duran arayüzlerdeki mor gradyan, parlama, emoji etiket gibi izleri bulur."
  - "Boşluk, renk, ikon, metin, yazı tipi, yerleşim ve hareketi bu sırayla düzeltir; özellikleri ve içeriği korur."
  - "Ürünün kendisinden bir görsel yön çıkarır; görsel üretme aracı varsa gerçek bir ana görsel hazırlar."
