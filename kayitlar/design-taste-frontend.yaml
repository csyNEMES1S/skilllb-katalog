# TASLAK (keşif): Türkçe metinler Claude çevirisi, gözden geçirin; SKILL.md'yi okuyun, sonra birleştirin.
id: design-taste-frontend
ad: Modern Web Sitesi Tasarımı
kisaAciklama: Figma ve x.ai düzeyinde, şablon hissi vermeyen kurumsal…
neIseYarar:
  - Ana sayfa, ürün, mağaza, otel ve yazılım siteleri için özgün ve düzenli sayfalar hazırlar.
  - Tasarımı tarayıcıda kontrol eder, sayfa giriş animasyonları ve mikro etkileşimler ekler.
  - Mevcut bir sayfa şablon gibi duruyorsa onu daha özgün bir görünüme kavuşturmaya yardımcı olur.
