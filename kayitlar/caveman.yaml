en:
  ad: "Terse Mode"
  kisaAciklama: "Keeps replies short and cuts the filler."
  neIseYarar:
    - "Shortens the AI's replies: gives the answer first and drops greetings, recaps and filler phrases."
    - "Keeps code, commands, file paths, numbers and error messages exactly as they are; switches to plain full sentences when brevity could cause confusion."
    - "Stays on for the whole session until you turn it off, so you read less and spend fewer output tokens."
  ornekCumleler:
    - "/caveman"
    - "Keep it short, no unnecessary explanations."
