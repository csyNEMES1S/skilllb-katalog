id: caveman
ad: "Kısa Konuşan Asistan"
kisaAciklama: "Yanıtları kısa tutar, gereksiz lafı keser."
neIseYarar:
  - "Yapay zekânın yanıtlarını kısaltır: önce cevabı verir, selamlama, özet ve gereksiz söz kalıplarını atar."
  - "Kod, komut, dosya yolu, sayı ve hata mesajlarını olduğu gibi korur; kısaltma anlamı bozacaksa düz ve açık yazar."
  - "Açıkça kapatana kadar oturum boyunca açık kalır; böylece okuduğun yazı ve harcanan çıktı miktarı azalır."
kategori: yazi
kaynak:
