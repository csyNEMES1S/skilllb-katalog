id: access-lifecycle
ad: Access Lifecycle
kisaAciklama: Use when preparing or running a user access review…
neIseYarar:
  - Use when preparing or running a user access review, checking that leavers lost their access, finding orphaned or ownerless service accounts, answering an auditor's access-control request for SOC 2, ISO 27001, PCI DSS, HIPAA or NIST 800-53, or checking whether a finished review campaign will hold up.
  - Diffs the HR roster against account exports, tests the campaign for coverage, self-review, unremoved revokes and rubber-stamping, and maps every exception to the controls it breaks.
  - "Betik içerir: scripts/access_diff.py, scripts/access_review_campaign.py, scripts/control_evidence_mapper.py."
