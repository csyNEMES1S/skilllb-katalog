en:
  ad: "Accessibility Audit"
  kisaAciklama: "Finds and fixes accessibility problems in web interfaces."
  neIseYarar:
    - "Scans project code against WCAG 2.2 A and AA rules, finding missing image descriptions, buttons unusable by keyboard and form gaps."
    - "Measures color contrast, ranks issues by severity and suggests fix code for React, Vue, Angular, Svelte or plain HTML."
    - "Re-runs the scan after fixes to verify them, and can prepare a readable report for stakeholders and a CI setup."
  ornekCumleler:
    - "Run an accessibility audit on my website and fix the issues."
    - "Check whether these two colors have enough contrast for text."
    - "Prepare the accessibility issues as a report for management."
