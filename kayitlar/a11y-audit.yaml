id: a11y-audit
ad: "Erişilebilirlik Denetimi"
kisaAciklama: "Arayüzdeki erişilebilirlik sorunlarını bulup düzeltir."
neIseYarar:
  - "Projedeki kodu WCAG 2.2 A ve AA kurallarına göre tarar; eksik görsel açıklamaları, klavyeyle kullanılamayan düğmeleri ve forma ait eksikleri bulur."
  - "Renk karşıtlığını ölçer, sorunları ciddiyetine göre sıralar ve React, Vue, Angular, Svelte ya da düz HTML için düzeltme kodu önerir."
  - "Düzeltmeden sonra taramayı yeniden çalıştırıp doğrular; yönetici ve ekip için okunur bir rapor ile CI ayarı hazırlayabilir."
