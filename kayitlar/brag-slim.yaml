id: brag-slim
ad: "Hafif Tanıtım Videosu"
kisaAciklama: "Proje ya da site adresinden kısa tanıtım videosu yapar."
neIseYarar:
  - "Proje klasöründen ya da bir web sitesi adresinden 15-25 saniyelik paylaşılabilir bir tanıtım videosu hazırlar."
  - "Hazır müzik dosyası içermez; hikâyeyi, görselleri, sesi ve çıktıyı bilgisayardaki araçlarla kendisi üretir."
  - "MP4 videoyu, kapak görselini ve paylaşım metnini hazırlar; sır, anahtar ve kişisel verileri videoya sokmaz."
kategori: tasarim
kaynak:
  repo: latent-spaces/brag
  yol: skills/brag-slim
  dal: main
