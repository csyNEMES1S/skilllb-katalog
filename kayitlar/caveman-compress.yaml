id: caveman-compress
ad: Kısa Bellek Sıkıştırma
kisaAciklama: CLAUDE.md gibi bellek dosyalarını token tasarrufu için…
neIseYarar:
  - CLAUDE.md veya yapılacaklar listesi gibi dosyaları daha kısa bir biçime dönüştürür.
  - Orijinal dosyanın okunabilir bir yedeğini saklayarak içeriği kaybetmeden sıkıştırır.
  - Girdi token'larını azaltarak her oturumda daha az kaynak harcanmasına yardımcı olur.
