id: handoff
ad: "Devir Notu"
kisaAciklama: "Sohbeti, yeni oturumun devralacağı kısa nota çevirir."
neIseYarar:
  - "Şu ana kadarki konuşmayı, yeni bir yapay zekâ oturumunun kaldığı yerden sürdürebileceği kısa bir devir notuna özetler."
  - "Notta bir sonraki oturumun hangi skill'leri kullanması gerektiğini önerir; plan ve karar belgelerini tekrar yazmak yerine yoluyla gösterir."
  - "Notu çalışma klasörüne değil geçici klasöre kaydeder ve parola, anahtar gibi gizli bilgileri siler."
kategori: yazi
kaynak:
  repo: mattpocock/skills
  yol: skills/productivity/handoff
  dal: main
