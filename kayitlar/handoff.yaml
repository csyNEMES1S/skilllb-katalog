gorseller:
  ikon: gorseller/handoff/ikon.svg
  kapak: gorseller/handoff/kapak.svg
ornekCumleler:
  - "/handoff Yarın arayüz testlerine devam edeceğiz"
  - "Bu konuşmayı başka bir oturuma devretmek için not hazırla."
uyumluluk:
  claude:
    durum: calisir
    neden: "Elle /handoff komutuyla çalıştırılacak şekilde ayarlı; kendiliğinden devreye girmez."
    sahibiDenedi: false
  antigravity:
    durum: bilinmiyor
    sahibiDenedi: false
dogrulandi: false
benzerler: [teach]
en:
  ad: "Handoff Note"
  kisaAciklama: "Turns a chat into a short note for the next session."
  neIseYarar:
    - "Summarizes the conversation so far into a short handoff note a fresh AI session can pick up and continue from."
    - "Suggests which skills the next session should use and points to plans and decision documents by path instead of rewriting them."
    - "Saves the note to a temporary folder rather than your workspace and removes secrets such as passwords and keys."
  ornekCumleler:
    - "/handoff We will continue with the interface tests tomorrow"
    - "Write a note so I can hand this conversation over to another session."
