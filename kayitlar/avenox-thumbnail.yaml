en:
  ad: "YouTube Thumbnail Factory"
  kisaAciklama: "Makes eye-catching mascot YouTube thumbnails."
  neIseYarar:
    - "Designs a thumbnail with a bold 2-4 word hook, your mascot and a tool logo that fits the video."
    - "Generates several alternatives at once, removes duplicates and recommends the best one."
    - "Resizes the result to YouTube's 1280x720 and leaves it ready for A/B testing."
  ornekCumleler:
    - "Make three different thumbnail options for my latest video."
    - "Use my mascot to create new thumbnails for my older videos."
