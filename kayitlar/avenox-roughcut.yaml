en:
  ad: "Video Rough Cut"
  kisaAciklama: "Cuts silences and bad takes from raw footage."
  neIseYarar:
    - "Transcribes a raw screen or talking-head recording and lists repeated or half-finished sentences."
    - "Cuts the bad takes only after you approve the list, then removes dead air automatically."
