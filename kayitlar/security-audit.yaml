id: security-audit
ad: "Kapsamlı Güvenlik Denetimi"
kisaAciklama: "Kod tabanında gerçek güvenlik açıklarını bulur, raporlar."
neIseYarar:
  - "Kod tabanında gerçek bir güven sınırını aşan güvenlik açıklarını arar; kaynak koda dayanır, savunma amaçlıdır."
  - "Varsayılan olarak yalnızca güvenlik sorularına yol gösterir; tam denetimi ancak sen açıkça istersen başlatır."
  - "Tam denetimde keşif, tarama ve doğrulama aşamalarından geçip bulguları ve en küçük etkili düzeltmeyi içeren bir rapor yazar."
