neIseYarar:
  - "Supabase veritabanı, giriş (Auth), depolama ve Edge Function işlerinde güncel belgelere bakarak ilerler."
  - "Satır güvenliği (RLS), anahtar gizliliği ve görünümler gibi sık yapılan güvenlik hatalarını kontrol listesiyle önler."
  - "Hata ayıklamada logları ve belgeleri inceler, tablo değişikliklerini düzgün biçimde taşıma dosyalarına (migration) çevirir."
kategori: kod-test
kaynak:
  repo: supabase/agent-skills
