  - "Supabase'de kullanıcıların yalnız kendi satırlarını görmesi için güvenlik kuralı yaz."
  - "Supabase'de bu tabloya yazarken neden izin hatası alıyorum, bakar mısın?"
  - "Veritabanıma yeni bir tablo ekle ve değişikliği migration olarak kaydet."
uyumluluk:
  claude:
    durum: calisir
    neden: "Güncel belgeler ve değişiklik günlüğü için supabase.com'a bağlanır; Supabase hesabı ve (varsa) Supabase CLI ya da MCP bağlantısı gerekir."
