    sahibiDenedi: false
dogrulandi: false
benzerler: [supabase-postgres-best-practices]
en:
  ad: "Supabase Guide"
  kisaAciklama: "Current, safe guidance for working with Supabase."
  neIseYarar:
    - "Checks current docs while working on Supabase database, Auth, Storage and Edge Function tasks."
    - "Runs a security checklist to avoid common mistakes with row-level security, API keys and views."
    - "Helps debug errors using logs and docs, and turns table changes into proper migrations."
  ornekCumleler:
    - "Write a security rule so users can only see their own rows in Supabase."
    - "Why do I get a permission error when writing to this Supabase table?"
    - "Add a new table to my database and save the change as a migration."
